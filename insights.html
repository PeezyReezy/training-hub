<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1320"><title>Strength Insights · Training Hub</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0b1320;color:#eaf1fa}*{box-sizing:border-box}body{max-width:720px;margin:auto;padding:18px 13px 90px}h1{font-size:28px;margin:6px 0}h2{font-size:18px;margin:0 0 12px}p{line-height:1.5}.muted,label{color:#b1c2d8;font-size:13px}.eyebrow{font-size:11px;color:#9db8d9;letter-spacing:.1em}.panel{background:#162238;border:1px solid #30435f;border-radius:17px;padding:15px;margin:13px 0}.app-tabs{display:flex;gap:8px;margin:4px 0 18px}.app-tabs a{flex:1;text-align:center;padding:11px 4px;border:1px solid #465a78;border-radius:10px;text-decoration:none;color:#c5d6ec;font-size:14px}.app-tabs a[aria-current]{background:#294b7b;border-color:#85b6ff;color:white}label{display:block;margin:12px 0 5px}select,input,button{font:inherit;min-width:0;width:100%;color:#fff;background:#0c182b;border:1px solid #465a78;border-radius:9px;padding:10px;height:44px}input[type=date]{appearance:none;-webkit-appearance:none}input::-webkit-date-and-time-value{text-align:left;min-width:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid>div{min-width:0}button{cursor:pointer;background:#294b7b;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}.stats strong{display:block;font-size:20px;margin-top:6px}.stats div{background:#0f1b2e;border-radius:10px;padding:10px;overflow-wrap:anywhere}.chart{width:100%;max-height:320px;display:block}.chart text{fill:#b1c2d8;font-size:12px}.point{fill:#85b6ff;stroke:#162238;stroke-width:2;cursor:pointer}.point:focus{outline:none;stroke:#fff;stroke-width:4}.history-row{border-top:1px solid #34455e;padding:12px 0;overflow-wrap:anywhere}.history-row:first-of-type{border:0}.history-row a{color:#a8ceff}.history-row p{margin:5px 0}.error{color:#ffc1b9}.hidden{display:none}#pointDetail{min-height:1.5em}
</style></head><body>
<nav class="app-tabs" aria-label="Main navigation"><a href="/">Dashboard</a><a href="/strength.html">Strength</a><a href="/insights.html" aria-current="page">Insights</a></nav>
<div class="eyebrow">YOUR STRENGTH OVER TIME</div><h1>Insights</h1><p class="muted">Follow the exercises in Strength A and Strength B using the history saved on this device.</p>
<section class="panel"><label for="exercise">Exercise</label><select id="exercise"></select>
<label for="measure">Measure</label><select id="measure"><option value="weight">Heaviest weight per session (lb)</option><option value="averageReps">Average reps per set</option></select>
<div class="grid"><div><label for="from">From</label><input id="from" type="date"></div><div><label for="to">To</label><input id="to" type="date"></div></div>
<button id="allTime">Show all logged history</button><p id="filterError" class="error" role="alert"></p></section>
<section class="panel"><h2 id="chartTitle">Weight trend</h2><p id="measureHelp" class="muted"></p>
<div id="stats" class="stats"></div><div id="chart"></div><p id="pointDetail" class="muted" aria-live="polite"></p></section>
<section class="panel"><h2>Session history</h2><p class="muted">Completed sets only. Tap a date to open that workout. Prefilled, unchecked sets are excluded.</p><div id="sessionHistory"></div></section>
<script src="/strength-plans.js"></script><script src="/insights-data.js"></script><script src="/insights.js"></script>
</body></html>
